name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/gilgaevi/server-status-monitor:latest

  integration-test:
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      DB_HOST: postgres
      DB_USER: user
      DB_PASSWORD: pass
      DB_NAME: appdb
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pull image from GHCR
        run: docker pull ghcr.io/gilgaevi/server-status-monitor:latest
  - name: Start application
        run: docker compose up -d

      - name: Wait for startup
        run: sleep 15

      - name: Check containers status
        run: docker compose ps

      - name: Test Health Endpoint
        run: curl --fail http://localhost/health

      - name: Test Main Page (Status Board)
        run: curl --fail http://localhost/

      - name: Show logs if failed
        if: failure()
        run: docker compose logs
